name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check formatting
        run: npx oxfmt --check .

      - name: Lint
        run: npx oxlint .

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # `node --test` collects *.test.js only, so the Playwright specs under
      # tests/e2e/ never run here (they need the pinned browser image and run
      # in the e2e job below).
      - name: Run unit tests
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Verify package
        run: npm pack --dry-run

  # Browser E2E on the pinned Playwright image against a real fake-mic
  # browser. Uses `test/e2e/run-container.sh --poc-only`, which needs no
  # OpenCode server, so it is hermetic and fast enough for every PR.
  #
  # The full stack (opencode-web + sidecar + e2e) stays a manual, user-side
  # acceptance run: it pulls a community-built OpenCode image and mutates the
  # host checkout's node_modules volume.
  e2e:
    name: Browser E2E (fake mic)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: POC fake-mic capture in pinned Playwright image
        run: npm run test:e2e:poc

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          # keep the report browsable directly from the artifact listing
          if-no-files-found: ignore
