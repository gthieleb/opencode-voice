name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger: lets a fork branch (which has no pull request and does not
  # push to main) run the pipeline on demand.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check formatting
        run: npx oxfmt --check .

      - name: Lint
        run: npx oxlint .

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # `node --test` collects *.test.js only, so the Playwright specs under
      # tests/e2e/ never run here (they need the pinned browser image and run
      # in the e2e job below).
      - name: Run unit tests
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Verify package
        run: npm pack --dry-run

  # Browser E2E on the pinned Playwright image against a real fake-mic
  # browser.
  #
  # This runs Playwright directly in the pinned image rather than through
  # test/e2e/run-container.sh: that script orchestrates the full podman stack
  # (opencode-web + sidecar) and refuses to start without podman, which a
  # GitHub runner does not have. The POC spec is self-contained — it serves
  # its own throwaway page on 127.0.0.1 and needs only FIXTURE_WAV — so the
  # image plus the repo is all it takes.
  #
  # The full stack stays a manual, user-side acceptance run: it pulls a
  # community-built OpenCode image and mutates the checkout's node_modules
  # volume.
  e2e:
    name: Browser E2E (fake mic)
    runs-on: ubuntu-latest
    needs: [lint]
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4

      # No actions/setup-node here: the image already carries Node, and
      # setup-node would write its toolcache and npm cache into a HOME owned
      # by a different user than the container user (1001), which is a
      # recurring failure mode in Playwright container jobs. Print the version
      # so a mismatch with the unit-test matrix is visible in the log.
      - name: Node version
        run: node --version && npm --version

      - run: npm ci --no-audit --no-fund

      # The spec reads FIXTURE_WAV and playwright.config.js passes it to
      # Chromium's --use-file-for-fake-audio-capture flag.
      - name: POC fake-mic capture
        env:
          FIXTURE_WAV: ${{ github.workspace }}/tests/e2e/fixtures/german-tone-fixture.wav
        run: npx playwright test tests/e2e/poc-fake-mic.spec.js

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          # keep the report browsable directly from the artifact listing
          if-no-files-found: ignore
